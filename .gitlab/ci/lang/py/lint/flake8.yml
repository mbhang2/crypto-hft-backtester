check:python:flake8:
  extends:
    - .check
    - .only-review-python
  script:
    - bash check_python_conventions.sh
  artifacts:
    when: on_failure
    expire_in: 1 day
    expose_as: 'Flake8 Report'
    name: "Flake8-$CI_COMMIT_REF_SLUG"
    paths:
      - flake8.log
