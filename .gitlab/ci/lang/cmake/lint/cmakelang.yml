# Format

check:cmake:format:
  extends: .check-cmake
  allow_failure: true
  script:
    - ./scripts/cicd/lint/check_cmake_files_formatting.sh
  artifacts:
    when: on_failure
    expire_in: 1 day
    expose_as: 'CmakeFormat Report'
    name: "CmakeFormat-$CI_COMMIT_REF_SLUG"
    paths:
      - cmake_format.patch

# Lint

check:cmake:lint:
  extends: .check-cmake
  allow_failure: true
  script:
    - ./scripts/cicd/lint/check_cmake_conventions.sh
  artifacts:
    when: on_failure
    expire_in: 1 day
    expose_as: 'CmakeLint Report'
    name: "CmakeLint-$CI_COMMIT_REF_SLUG"
    paths:
      - cmake_lint.patch
