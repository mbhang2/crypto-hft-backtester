check:code:license:
  extends:
    - .check
  allow_failure: true
  script:
    - check_license_headers.sh
  only:
    refs:
      - merge_requests
  artifacts:
    when: on_failure
    expire_in: 1 day
    expose_as: 'License Headers Report'
    name: "LicenseHeaders-$CI_COMMIT_REF_SLUG"
    paths:
      - license_headers.log
