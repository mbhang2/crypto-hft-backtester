.windows-cpp-base-setup: &windows-cpp-base-setup
  - Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
  - $global:ChocolateyUseWindowsCompression = 0
  - |-
      if (Get-Variable 'CHOCO_CACHE_DIR' -s global -ea ig) {
        choco config set cacheLocation "$CHOCO_CACHE_DIR"
      }
  - choco feature disable --name showDownloadProgress
  - choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' --version 3.22.0

.windows-cpp-tags:
  tags:
    - shared-windows
    - windows
    - windows-1809

# Build

build:cpp:windows:
  stage: build
  extends:
    - .only-review-cpp-manual
    - .windows-cpp-tags
  variables:
    CACHE_DIR: "$CI_PROJECT_DIR\\.cache"
    # Setup package managers
    CHOCO_CACHE_DIR: "$CACHE_DIR\\choco"
    CONAN_USER_HOME: "$CACHE_DIR"
    # We must set short to something, take a look here:
    #   - https://github.com/conan-io/conan/issues/9763
    CONAN_USER_HOME_SHORT: "$CACHE_DIR\\short"
    PIP_CACHE_DIR: "$CACHE_DIR\\pip"
  cache:
    - key: "$CI_PROJECT_ID-windows"
      paths:
        - "$CACHE_DIR"
  interruptible: false
  before_script:
    - *windows-cpp-base-setup
    - choco install -y python3
    - refreshenv
    - python -m pip install -U pip
    - pip3 install "conan==1.49.0"
  script:
    - cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=Debug
    - |-
        if ("${CI_COMMIT_REF_NAME}" -ne "${CI_DEFAULT_BRANCH}") {
          cmake --build build -j"$env:NUMBER_OF_PROCESSORS" 2>&1 `
            | % ToString | Tee-Object build/CompilationLog.txt
        }
  artifacts:
    !reference [.build-cpp, artifacts]

# Test

test:cpp:windows:
  stage: test
  extends:
    - .only-review-cpp
    - .windows-cpp-tags
  when: on_success
  needs:
    - job: build:cpp:windows
      artifacts: true
  variables:
    !reference [.test-cpp, variables]
  before_script:
    - *windows-cpp-base-setup
    - refreshenv
  script:
    - cd build
    - ctest -j$NUMBER_OF_PROCESSORS
  artifacts:
    !reference [.test-cpp, artifacts]

# Report

report:cpp:windows:
  extends: .report-build-cpp
  needs:
    - job: build:cpp:windows
      artifacts: true
