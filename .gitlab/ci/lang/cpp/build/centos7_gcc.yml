# Build

build:cpp:centos7:gcc:
  image: $BPROTO_CI_IMAGES_REGISTRY/centos7:latest
  extends: .build-cpp
  variables:
    BPROTO_CI_CMAKE_BUILD_TYPE: "Release"
    BPROTO_CI_CMAKE_ARGS: "-DCMOPTS_ENABLE_LTO=ON"
    CC: gcc
    CXX: g++

# Test

test:cpp:centos7:gcc:
  image: $BPROTO_CI_IMAGES_REGISTRY/centos7:latest
  extends: .test-cpp
  needs:
    - job: build:cpp:centos7:gcc
      artifacts: true

# Report

report:cpp:centos7:gcc:
  extends: .report-build-cpp
  needs:
    - job: build:cpp:centos7:gcc
      artifacts: true
