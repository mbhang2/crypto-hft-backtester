.build-cpp:
  stage: build
  extends: .only-review-cpp
  interruptible: false
  variables:
    CMAKE_GENERATOR: Unix Makefiles
  before_script:
    - NPROC=$(nproc || sysctl -n hw.physicalcpu) 2>/dev/null
  script:
    - mkdir -p build
    - make -j${NPROC} 2>&1 | tee build/CompilationLog.txt
  artifacts:
    expire_in: 2 hrs
    when: always
    paths:
      - build/CompilationLog.txt
      - build/bin/

.test-cpp:
  stage: test
  extends: .only-review-cpp
  when: on_success
  variables:
    BOOST_TEST_LOGGER: "JUNIT,all,test_results.xml:HRF,warning"
    CTEST_OUTPUT_ON_FAILURE: 1
    GIT_CHECKOUT: "false"
    GIT_STRATEGY: none
    ASAN_OPTIONS: "log_threads=1:verbosity=1"
    LSAN_OPTIONS: "log_threads=1:verbosity=1"
    TSAN_OPTIONS: "log_threads=1:verbosity=1"
  before_script:
    - NPROC=$(nproc || sysctl -n hw.physicalcpu) 2>/dev/null
  script:
    - make test -j${NPROC}
  artifacts:
    reports:
      junit:
        - build/**/test_results.xml

.report-build-cpp:
  extends:
    - .only-review-cpp
    - .report
  script:
    - cp /build/CompilationLog.txt .
  artifacts:
    expire_in: 1 day
    expose_as: 'Build log'
    name: "BuildLog-$CI_COMMIT_REF_SLUG"
    paths:
      - CompilationLog.txt