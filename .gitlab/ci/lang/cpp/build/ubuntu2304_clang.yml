# Build

build:cpp:ubuntu2304:clang:
  image: $BPROTO_CI_IMAGES_REGISTRY/ubuntu2304:latest
  extends: .build-cpp
  variables:
    BPROTO_CI_CMAKE_ARGS: >-
      -DCMOPTS_ENABLE_LTO=OFF
      -DCMOPTS_ENABLE_SANITIZER_THREAD=ON
      -DCPPDOC_ENABLE=ON
    CC: clang
    CXX: clang++

# Test

test:cpp:ubuntu2304:clang:
  image: $BPROTO_CI_IMAGES_REGISTRY/ubuntu2304:latest
  extends: .test-cpp
  needs:
    - job: build:cpp:ubuntu2304:clang
      artifacts: true

# Report

report:cpp:ubuntu2304:clang:
  extends: .report-build-cpp
  needs:
    - job: build:cpp:ubuntu2304:clang
      artifacts: true
