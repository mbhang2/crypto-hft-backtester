# Initially it has been planned to use an artifact from the 'build' stage.
# That said, this approach might cause an unexpected security breaches.
# It also worth to mention that such an artifact can occupy quite a lot of
# space.
check:cpp:coverage:
  image:
    name: $BPROTO_CI_IMAGES_REGISTRY/ubuntu2304:latest
    entrypoint: [""]
  stage: check
  extends:
    - .build-cpp
  dependencies: []
  needs: []
  when: manual
  variables:
    BPROTO_CI_CMAKE_ARGS: "-DCMOPTS_ENABLE_COVERAGE=ON"
    CC: gcc
    CXX: g++
  script:
    - |-
      cmake -S. -Bbuild \
        ${BPROTO_CI_CMAKE_BUILD_TYPE} \
        ${BPROTO_CI_CMAKE_ARGS} \
        ${BPROTO_CI_CMAKE_EXTRA_ARGS} \
        ${BPROTO_CI_CMAKE_TOOLCHAIN_FILE}
    # Build everything
    - cmake --build build -j${NPROC}
    # Calculate coverage
    - cmake --build build -j${NPROC} --target coverage
  artifacts:
    expire_in: 2 hrs
    when: on_success
    paths:
      - build/coverage/

report:cpp:coverage:
  extends:
    - .only-review-cpp
    - .report
  allow_failure: true
  when: on_success
  needs:
    - job: check:cpp:coverage
      artifacts: true
  script:
    - mv build/coverage/* .
    - rm -rf build
  environment:
    name: coverage-html-docs-$CI_COMMIT_REF_SLUG
    url: https://${CI_PROJECT_ROOT_NAMESPACE}.${CI_PAGES_DOMAIN}/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/coverage.html
    auto_stop_in: 1 day
  artifacts:
    when: always
    expire_in: 1 day
    expose_as: 'Coverage HTML Report'
    name: "CoverageHtmlReport-$CI_COMMIT_REF_SLUG"
    exclude:
      - '**/*.xml'
    paths:
      - ./
