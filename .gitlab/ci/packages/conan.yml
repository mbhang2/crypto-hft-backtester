.conan-base:
  image: conanio/gcc9:latest
  script:
    - |-
        declare -r name="${BPROTO_CI_CONAN_PACKAGE_NAME}"
        declare -r user="${BPROTO_CI_USER}"
        declare -r channel="${CI_PROJECT_ROOT_NAMESPACE}"

        while IFS= read -r version; do
          declare reference="${name}/${version}@${user}/${channel}"
          conan create . "${reference}" --build=missing

          if [[ "${CI_COMMIT_REF_NAME}" == "${CI_DEFAULT_BRANCH}" ]]; then
            # https://docs.conan.io/2/reference/commands/upload.html
            # Upload only a package recipe (conanfile.py and the exported files).
            conan upload "${reference}" --remote=gitlab
          fi
        done < <(sed -En 's|^  "([0-9a-z.]+)":$|\1|p' conandata.yml)

.conan-changes: &conan-changes
  - test_package/**/*
  - conandata.yml
  - conanfile.py

build:conan:
  stage: build
  extends: .conan-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *conan-changes

deploy:conan:
  stage: deploy
  extends: .conan-base
  before_script:
    - conan remote add gitlab "${BPROTO_CI_CONAN_PACKAGES_REGISTRY}"
    - conan user "${CI_DEPLOY_USER}" -r gitlab -p "${CI_DEPLOY_TOKEN}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *conan-changes
