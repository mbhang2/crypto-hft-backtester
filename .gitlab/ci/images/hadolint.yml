.hadolint-image-changes: &hadolint-image-changes
  - docker/HadoLint.Dockerfile
  - scripts/os/install_files.sh

.hadolint-image-variables: &hadolint-image-variables
  DOCKER_IMAGE_NAME: "hadolint:latest"
  DOCKER_IMAGE_OS: "HadoLint"

build:docker:hadolint:
  stage: build
  extends: .docker
  variables:
    <<: *hadolint-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *hadolint-image-changes

deploy:docker:hadolint:
  stage: deploy
  extends: .docker
  variables:
    <<: *hadolint-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *hadolint-image-changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/cicd/lint/check_docker_conventions.sh
        - scripts/cicd/lint/filter_files.sh
        - .hadolint.yaml
