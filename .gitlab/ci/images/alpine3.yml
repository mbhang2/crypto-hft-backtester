.alpine3-image-changes: &alpine3-image-changes
  - docker/Alpine3.Dockerfile
  - scripts/os/install_files.sh
  - scripts/os/setup_alpine3.sh
  - pyproject.toml

.alpine3-image-variables: &alpine3-image-variables
  DOCKER_IMAGE_NAME: "alpine3:latest"
  DOCKER_IMAGE_OS: "Alpine3"

build:docker:alpine3:
  stage: build
  extends: .docker
  variables:
    <<: *alpine3-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *alpine3-image-changes

deploy:docker:alpine3:
  stage: deploy
  extends: .docker
  variables:
    <<: *alpine3-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *alpine3-image-changes
    - !reference [.trigger-docker-on-linters-files-change, rules]
