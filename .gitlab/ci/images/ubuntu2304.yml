.ubuntu2304_changes: &ubuntu2304_changes
  - conan/profiles/linux_*
  - conan/conanfile.txt
  - docker/Ubuntu2304.Dockerfile
  - scripts/conan/*.sh
  - scripts/os/install_files.sh
  - scripts/os/setup_ubuntu2304.sh
  - pyproject.toml

.ubuntu2304_variables: &ubuntu2304_variables
  DOCKER_IMAGE_NAME: "ubuntu2304:latest"
  DOCKER_IMAGE_OS: "Ubuntu2304"

build:docker:ubuntu2304:
  stage: build
  extends: .docker
  variables:
    <<: *ubuntu2304_variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *ubuntu2304_changes

deploy:docker:ubuntu2304:
  stage: deploy
  extends: .docker
  variables:
    <<: *ubuntu2304_variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *ubuntu2304_changes
    - !reference [.trigger-docker-on-linters-files-change, rules]
