.clang-format-image-changes: &clang-format-image-changes
  - docker/ClangFormat.Dockerfile
  - scripts/os/install_files.sh

.clang-format-image-variables: &clang-format-image-variables
  DOCKER_BUILDKIT: "1"
  DOCKER_IMAGE_NAME: "clang-format:latest"
  DOCKER_IMAGE_OS: "ClangFormat"

build:docker:clang-format:
  stage: build
  extends: .docker
  variables:
    <<: *clang-format-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *clang-format-image-changes

.deploy:docker:clang-format:
  stage: deploy
  extends: .docker
  variables:
    <<: *clang-format-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *clang-format-image-changes
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - scripts/cicd/lint/check_cpp_files_formatting.sh
        - scripts/cicd/lint/filter_files.sh
        - .clang-format
