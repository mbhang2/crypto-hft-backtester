.centos8-image-changes: &centos8-image-changes
  - conan/profiles/linux_*
  - conan/conanfile.txt
  - docker/CentOS8.Dockerfile
  - scripts/conan/*.sh
  - scripts/os/setup_centos8.sh
  - pyproject.toml

.centos8-image-variables: &centos8-image-variables
  DOCKER_IMAGE_NAME: "centos8:latest"
  DOCKER_IMAGE_OS: "CentOS8"

build:docker:centos8:
  stage: build
  extends: .docker
  variables:
    <<: *centos8-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *centos8-image-changes
      when: manual

deploy:docker:centos8:
  stage: deploy
  extends: .docker
  variables:
    <<: *centos8-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *centos8-image-changes
      when: never
