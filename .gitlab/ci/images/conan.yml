.conan-image-changes: &conan-image-changes
  - docker/Conan.Dockerfile
  - scripts/os/setup_conan.sh

.conan-image-variables: &conan-image-variables
  DOCKER_IMAGE_NAME: "conan:latest"
  DOCKER_IMAGE_OS: "Conan"

build:docker:conan:
  stage: build
  extends: .docker
  variables:
    <<: *conan-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        *conan-image-changes

deploy:docker:conan:
  stage: deploy
  extends: .docker
  variables:
    <<: *conan-image-variables
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *conan-image-changes
