.sphinx-files-changes: &sphinx-files-changes
  - "docs/**/*"

.only-review-sphinx-files:
  only:
    refs:
      - merge_requests
    changes:
      *sphinx-files-changes

build:docs:
  image:
    name: "${BPROTO_CI_IMAGES_REGISTRY}/alpine3:latest"
    entrypoint: [""]
  stage: build
  extends:
    - .only-review-sphinx-files
  script:
    - build_sphinx_docs.py
  artifacts:
    expire_in: 2 hrs
    when: on_success
    paths:
      - build/

report:docs:
  extends:
    - .only-review-sphinx-files
    - .report
  when: on_success
  needs:
    - job: build:docs
      artifacts: true
  script:
    - mv build/* .
    - rm -rf build
  environment:
    name: sphinx-html-docs-$CI_COMMIT_REF_SLUG
    url: https://${CI_PROJECT_ROOT_NAMESPACE}.${CI_PAGES_DOMAIN}/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/index.html
    auto_stop_in: 1 day
  artifacts:
    when: always
    expire_in: 1 day
    expose_as: 'Sphinx HTML Documentation'
    name: "SphinxHtmlDocs-$CI_COMMIT_REF_SLUG"
    paths:
      - ./

pages:
  image:
    name: "${BPROTO_CI_IMAGES_REGISTRY}/alpine3:latest"
    entrypoint: [""]
  stage: deploy
  dependencies: []
  needs: []
  script:
    - build_sphinx_docs.py -o public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        *sphinx-files-changes
  artifacts:
    paths:
      - public
