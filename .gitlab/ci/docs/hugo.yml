.build-hugo-page:
  image: registry.gitlab.com/pages/hugo/hugo_extended:0.111.3
  variables:
    # GitLab CI/CD pipeline settings
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_STRATEGY: normal
    # Hugo settings
    HUGO_ENV: production
  before_script:
    - hugo --gc --minify
  script:
    - echo

build:docs:
  extends: .build-hugo-page
  only:
    refs:
      - merge_requests

pages:
  extends: .build-hugo-page
  variables:
    HUGO_BASEURL: "${CI_PAGES_URL}"
  only:
    refs:
      - main
  artifacts:
    paths:
      - public
